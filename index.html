<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reiseblog</title>
    <link rel="icon" href="./images/logo-header.png" type="image/png" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/header-nav.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-content">
        <a href="./index.html">
          <img
            class="logo-header"
            src="./images/logo-header.png"
            alt="travel blog logo"
          />
        </a>

        <nav class="navigation">
          <ul>
            <li>
              <a href="#highlights">Highlights</a>
            </li>
            <li>
              <a href="#faq">FAQ</a>
            </li>
            <li>
              <a href="#contact">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-left">
          <div class="copyright-element">
            <img
              class="copyright-sign"
              src="./images/copyright.png"
              alt="copyright sign"
            />
            <span>Travel Blog 2026</span>
          </div>
          <a href="./impressum.html">Imprint</a>
          <span>Cookie Preferences</span>
        </div>
       
          <ul>
            <li>
              <a
                href="https://www.tiktok.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="./images/tiktok.png"
                  alt="tiktok"
                  class="social-icon"
                />
              </a>
            </li>
            <li>
              <a
                href="https://www.youtube.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="./images/youtube.png"
                  alt="youtube"
                  class="social-icon-youtube"
                />
              </a>
            </li>
            <li>
              <a
                href="https://www.facebook.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="./images/facebook.png"
                  alt="Facebook"
                  class="social-icon"
                />
              </a>
            </li>
            <li>
              <a
                href="https://www.instagram.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="./images/instagram.png"
                  alt="Instagram"
                  class="social-icon"
                />
              </a>
            </li>
          </ul>
       
      </div>
    </footer>
  </body>
</html>
